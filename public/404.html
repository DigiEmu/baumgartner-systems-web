<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — Evidence not found | Baumgartner Systems</title>
  <meta
    name="description"
    content="The requested Baumgartner Systems record could not be reconstructed."
  >
  <meta name="robots" content="noindex,follow">

  <meta name="theme-color" content="#b8912b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151619" media="(prefers-color-scheme: dark)">

  <link
    rel="icon"
    type="image/webp"
    href="/assets/images/brand/glyph.webp"
  >

  <script>
    (() => {
      const dark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

      document.documentElement.dataset.theme =
        dark ? "dark" : "light";
    })();
  </script>

  <link rel="stylesheet" href="/assets/css/site.css">

  <style>
    .error-page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .error-header {
      border-bottom: 1px solid var(--line);
    }

    .error-header__inner {
      min-height: 6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .error-home {
      color: var(--text-muted);
      font-size: .8rem;
      font-weight: 650;
      text-decoration: none;
    }

    .error-home:hover,
    .error-home:focus-visible {
      color: var(--accent);
    }

    .error-main {
      position: relative;
      display: grid;
      align-items: center;
      min-height: calc(100svh - 6rem);
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .error-main::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at 72% 45%,
          color-mix(in srgb, var(--accent) 8%, transparent),
          transparent 28rem
        );
      pointer-events: none;
    }

    .error-layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(16rem, .65fr);
      align-items: center;
      gap: clamp(3rem, 8vw, 8rem);
      padding-top: 5rem;
      padding-bottom: 5rem;
    }

    .error-copy {
      max-width: 48rem;
    }

    .error-code {
      margin: 0 0 1rem;
      color: color-mix(in srgb, var(--text) 18%, transparent);
      font-size: clamp(5rem, 16vw, 12rem);
      font-weight: 760;
      line-height: .8;
      letter-spacing: -.06em;
    }

    .error-copy h1 {
      max-width: 12ch;
      margin: 0;
    }

    .error-copy .lead {
      max-width: 35rem;
      margin-top: 1.25rem;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .85rem;
      margin-top: 2rem;
    }

    .error-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: .8rem 1.15rem;
      border: 1px solid color-mix(in srgb, var(--accent) 52%, var(--line));
      color: var(--text);
      font-size: .82rem;
      font-weight: 650;
      text-decoration: none;
    }

    .error-secondary:hover,
    .error-secondary:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
    }

    .error-visual {
      position: relative;
      width: min(26vw, 18rem);
      aspect-ratio: 1;
      justify-self: center;
    }

    .error-ring,
    .error-pearl {
      position: absolute;
      inset: 50% auto auto 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .error-ring {
      width: 100%;
      height: 100%;
      border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
      box-shadow:
        0 0 0 2.5rem color-mix(in srgb, var(--accent) 3%, transparent),
        0 0 0 5rem color-mix(in srgb, var(--accent) 2%, transparent);
    }

    .error-pearl {
      width: .85rem;
      height: .85rem;
      background:
        radial-gradient(
          circle at 30% 28%,
          #fff8d8 0%,
          #f6d96c 24%,
          #c99827 58%,
          #8b6110 100%
        );
      box-shadow:
        0 0 0 1px rgba(130, 88, 12, .35),
        0 0 24px rgba(213, 169, 55, .35);
    }

    @media (max-width: 760px) {
      .error-layout {
        grid-template-columns: 1fr;
        padding-top: 4rem;
        padding-bottom: 4rem;
      }

      .error-visual {
        width: 9rem;
        justify-self: start;
        margin-left: 2rem;
      }
    }

    @media (max-width: 480px) {
      .error-page .container {
        padding-left: 1.5rem !important;
        padding-right: 1.5rem !important;
      }

      .error-header__inner {
        min-height: 5rem;
      }
    }
  </style>
</head>

<body>
  <div class="error-page">

    <header class="error-header">
      <div class="container error-header__inner">

        <a
          class="site-brand"
          href="/"
          aria-label="Baumgartner Systems home"
        >
          <picture class="site-brand__picture">
            <source
              srcset="/assets/images/brand/logo-header-dark.webp"
              media="(prefers-color-scheme: dark)"
            >

            <img
              class="site-brand__logo"
              src="/assets/images/brand/logo-header.webp"
              alt="Baumgartner Digital Infrastructure"
              decoding="async"
            >
          </picture>
        </a>

        <a class="error-home" href="/">
          Return home
        </a>

      </div>
    </header>

    <main class="error-main">
      <div class="container error-layout">

        <div class="error-copy">
          <p class="eyebrow">Baumgartner Systems</p>

          <p class="error-code" aria-hidden="true">404</p>

          <h1>Evidence not found.</h1>

          <p class="lead">
            The requested record could not be reconstructed.
            The route may have moved, changed or never existed.
          </p>

          <div class="error-actions">
            <a class="cta" href="/">
              Return home
            </a>

            <a class="error-secondary" href="/pilot/">
              Discuss a Pilot
            </a>
          </div>
        </div>

        <div class="error-visual" aria-hidden="true">
          <span class="error-ring"></span>
          <span class="error-pearl"></span>
        </div>

      </div>
    </main>

  </div>

  <script src="/assets/js/theme.js" defer></script>
  <script src="/assets/js/cursor.js" defer></script>
</body>
</html>
